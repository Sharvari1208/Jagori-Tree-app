name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm ci

      - name: Prebuild Android native project
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL || 'https://hsgacrvdfyrplpcwikap.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhzZ2FjcnZkZnlycGxwY3dpa2FwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI3MjA1ODIsImV4cCI6MjEwODI5NjU4Mn0.n_yxOfpmtj68EsGkLKlQA_yoqA0SRPIL5ffxVVz07-E' }}
          EXPO_PUBLIC_QR_BASE_URL: 'https://rushing-dune-b1uvrp6.tmp.now'
          EXPO_PUBLIC_ADMIN_PIN: '2026'
        run: npx expo prebuild --platform android --clean

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Jagori-Tree-Tracker-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
